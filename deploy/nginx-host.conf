# Nginx on the BiznorX Realty VPS (plain Nginx, no Docker). Certbot adds the HTTPS lines to this file.
server {
    listen 80;
    listen [::]:80;
    server_name biznorxrealty.com www.biznorxrealty.com;
    root /var/www/biznorxrealty.com;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # www -> bare domain (one canonical address for Google)
    if ($host = www.biznorxrealty.com) {
        return 301 https://biznorxrealty.com$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Images keep their names; CSS/JS carry a ?v= hash from build.py
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;
}
